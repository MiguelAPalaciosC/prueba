<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Actualizar usuario</title>
    <link rel="stylesheet" th:href="@{/bootstrap-5.0.2/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/public/headers.css}">
    <link rel="stylesheet" th:href="@{/css/registro/style.css}">
    <style>
        /* .input-group .form-control,
        .input-group input {
            height: calc(2.5rem + 2px);
        } */
    </style>
</head>

<body>
    <div th:insert="~{/inset/header.html::header-app}"></div>

    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol id="check-circle-fill" fill="currentColor" viewBox="0 0 16 16">
            <path
                d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
        </symbol>
        <symbol id="info-fill" fill="currentColor" viewBox="0 0 16 16">
            <path
                d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z" />
        </symbol>
        <symbol id="exclamation-triangle-fill" fill="currentColor" viewBox="0 0 16 16">
            <path
                d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
        </symbol>
    </svg>
    <nav aria-label="breadcrumb">
		<ol class="breadcrumb">
			<li class="breadcrumb-item">Administrar</li>
			<li class="breadcrumb-item" aria-current="page"><a
					href="/admin/usuarios">Usuarios</a></li>
			<li class="breadcrumb-item" aria-current="page"><a
					th:href="'/admin/usuario/'+ ${usuario.id}" th:text="${usuario.nombre}">Usuarios</a></li>
		</ol>
	</nav>
    <section class="vh-100">
        <div class="container h-100">
            <div class="row d-flex align-items-center justify-content-center h-100">
                <div class="col-md-8 col-lg-7 col-xl-6">
                    <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.svg"
                        class="img-fluid" alt="Phone image">
                </div>
                <div class="col-md-7 col-lg-5 col-xl-5 offset-xl-1">

                    <div class="toast-container position-absolute top-5 end-0 p-3">
                        <div th:if="${param.exito}" class="toast text-white bg-warning" role="alert"
                            aria-live="assertive" aria-atomic="true">
                            <div class="toast-header">
                                <svg class="bi flex-shrink-0 me-2" width="24" height="24" role="img"
                                    aria-label="Success:">
                                    <use xlink:href="#check-circle-fill" />
                                </svg>
                                <strong class="me-auto">Éxito</strong>
                                <button type="button" class="btn-close" data-bs-dismiss="toast"
                                    aria-label="Close"></button>
                            </div>
                            <div class="toast-body">
                                Usuario actualizado exitosamente
                            </div>
                        </div>

                        <div th:if="${param.error}" class="toast text-white bg-danger" role="alert"
                            aria-live="assertive" aria-atomic="true">
                            <div class="toast-header">
                                <i class="bi bi-x-circle" style="font-size: xx-large;"></i>
                                <strong class="me-auto">Error</strong>
                                <button type="button" class="btn-close" data-bs-dismiss="toast"
                                    aria-label="Close"></button>
                            </div>
                            <div class="toast-body">
                                Hubo un error al actualizar el usuario
                            </div>
                        </div>
                    </div>

                    <form class="needs-validation" th:action="@{/admin/actualizarUsuario/{id}(id=${usuario.id})}"
                        method="post" novalidate id="formNuevaEmpresa">
                        <!-- Email input -->

                        <div data-mdb-input-init class="form-outline mb-4">
                            <h5 class="form-label " for="user">Usuario: </h5>
                            <input type="text" id="usuario" name="username" class="form-control form-control-lg"
                                required autofocus="autofocus" th:value="${usuario.username}" />
                        </div>

                        <!-- Password input -->
                        <div data-mdb-input-init class="form-outline mb-4">
                            <h5 class="form-label" for="pas">Nueva Contraseña: </h5>
                            <div class="input-group">
                                <input type="password" id="password" name="password"
                                    class="form-control form-control-lg" required autofocus="autofocus" />
                                <button type="button" id="togglePassword" class="btn btn-secondary btn-lg"><i
                                        class="bi bi-eye"></i></button>
                            </div>
                        </div>

                        <div data-mdb-input-init class="form-outline mb-4">
                            <h5 class="form-label " for="nombre">Nombre: </h5>
                            <input type="text" id="nombre" name="nombre" class="form-control form-control-lg" required
                                autofocus="autofocus" th:value="${usuario.nombre}" />
                        </div>

                        <div data-mdb-input-init class="form-outline mb-4">
                            <h5 class="form-label " for="cargo">Cargo: </h5>
                            <input type="text" id="cargo" name="cargo" class="form-control form-control-lg" required
                                autofocus="autofocus" th:value="${usuario.cargo}" />
                        </div>

                        
                        <div data-mdb-input-init class="form-outline mb-4">
                            <h5 class="form-label " for="cargo">Acceso: </h5>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="checkChecked">
                                <label class="form-check-label form-control-lg" for="checkChecked">
                                    Operativo contable
                                </label>
                            </div>                                                         
                        </div>

                        <div data-mdb-input-init class="form-outline mb-4">
                            <input type="hidden" id="estado" th:value="${usuario.estado}">
                            <h5 class="form-label " for="tipo_usuario">Estado: </h5>
                            <select name="estado" class="form-select form-control-lg form-select-lg estado" required>
                                <option value="" hidden>Seleccione una opción</option>
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>


                        <!-- Submit button -->
                        <button type="submit" data-mdb-button-init data-mdb-ripple-init
                            class="btn btn-ingresar btn-lg btn-block w-100">Registrar</button>


                    </form>
                </div>
            </div>
        </div>
    </section>

    <script th:src="@{/bootstrap-5.0.2/dist/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/public/jquery.js}"></script>
    <script th:src="@{/js/public/sweetalert2.all.min.js}"></script>
    <script th:src="@{/js/admin/editUsuario.js}" defer></script>
</body>

</html>
