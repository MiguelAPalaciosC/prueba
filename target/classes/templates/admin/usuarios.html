<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Mi Página</title>
	<link rel="stylesheet" th:href="@{/bootstrap-5.0.2/dist/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/icons/font/bootstrap-icons.min.css}">
	<link rel="stylesheet" th:href="@{/css/registro/style.css}">
	<link rel="stylesheet" th:href="@{/css/tablas/style.css}">
	<link rel="stylesheet" th:href="@{/css/public/headers.css}">
	<link rel="stylesheet" th:href="@{/css/public/form-validation.css}">
	<link rel="stylesheet" th:href="@{/css/public/sweetalert2.min.css}">
	<link rel="stylesheet" th:href="@{/datatable/dataTables.dataTables.css}">
	<style>
		table {
			width: 100%;
			border-collapse: collapse;
		}

		th,
		td {
			border: 1px solid #ddd;
			padding: 10px;
			text-align: center;
		}

		tr {
			cursor: pointer;
			transition: background-color 0.2s;
		}

		tr:hover {
			background-color: #f1f1f1;
		}

		.selected {
			background-color: #4CAF50 !important;
			color: white;
		}
	</style>
</head>

<body>
	<div th:insert="~{/inset/header.html::header-app}" id="header"></div>
	<nav aria-label="breadcrumb">
		<ol class="breadcrumb">
			<li class="breadcrumb-item">Administrar</li>
			<li class="breadcrumb-item" aria-current="page"><a
					href="/admin/usuarios">Usuarios</a></li>
		</ol>
	</nav>
	<div class="container titulo-fijo" id="titulo">
		<div class="row">
			<div class="col-md-8">
				<h2>Usuarios Registrados</h2>
			</div>
			<div class="col-md-2">
				<a class="btn btn-success w-100" th:href="@{/admin/registroUsuario}"><i class="bi bi-plus-square"></i>
					Nuevo</a>
			</div>
			<div class="col-md-2">
				<a class="btn btn-info w-100" id="btnEditar" th:href="@{#}"><i class="bi bi-pencil"></i> Editar</a>
			</div>
		</div>
	</div>

	<div class="container py-4 div-tabla">

		<div id="valorSeleccionado"></div>
		<table class="table table-striped py-2" id="miTabla">
			<thead>
				<tr>
					<th>Nombre</th>
					<th>Cargo</th>
					<th>Rol</th>
				</tr>
			</thead>
			<thead>
				<tr>
					<th><input type="text" class="form-control" id="buscar" placeholder="Buscar nombre" value=""
							required></th>
					<th><input type="text" class="form-control" id="buscar2" placeholder="Buscar cargo" value=""
							required></th>
					<th><input type="text" class="form-control" id="buscar3" placeholder="Buscar Rol" value="" required>
					</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="usuario : ${usuarios}" th:data-valor="${usuario.id}">
					<td th:text="${usuario.nombre}"></td>
					<td th:text="${usuario.cargo}"></td>
					<td>
						<span th:each="rol : ${usuario.roles}" th:text="${rol.nombre}"></span>
					</td>
				</tr>
			</tbody>
		</table>

	</div>


	<script th:src="@{/bootstrap-5.0.2/dist/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/js/public/jquery.js}"></script>
	<script th:src="@{/datatable/dataTables.js}"></script>
	<script th:src="@{/js/public/sweetalert2.all.min.js}"></script>
	<script th:src="@{/js/admin/editUsuario.js}" defer></script>
	<script th:src="@{/js/public/title.js}" defer></script>

</body>

</html>
